<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Meta Tag / Favicon Extractor</title>
  <meta name="description" content="Fetch a page title, description, thumbnail, and favicon from any URL." />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Crect x='3' y='3' width='10' height='7' rx='1' fill='none' stroke='%236ea8ff' stroke-width='1.4'/%3E%3Ccircle cx='8' cy='12' r='1.2' fill='%236ea8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site.js"></script>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .wrap { width: min(640px, calc(100% - 24px)); margin: 0 auto 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 14px; cursor: pointer; font: inherit; font-size: 13px;
    }
    button.primary { background: var(--accent); border-color: transparent; color: #fff; }
    button:disabled { opacity: .5; cursor: wait; }
    .err { color: #e11d48; font-size: 13px; margin-top: 8px; min-height: 1.2em; }
    .card {
      margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden; display: none;
    }
    .card.show { display: block; }
    .thumb { width: 100%; aspect-ratio: 16/8; object-fit: cover; background: var(--cell); display: block; }
    .thumb.empty { display: none; }
    .body { padding: 16px 18px 18px; }
    .title-row { display: flex; gap: 12px; align-items: flex-start; }
    .favicon { width: 32px; height: 32px; border-radius: 6px; background: var(--cell); object-fit: contain; flex-shrink: 0; }
    h2 { margin: 0 0 4px; font-size: 18px; }
    .desc { margin: 0; color: var(--muted); font-size: 14px; }
    .meta { margin-top: 12px; display: grid; gap: 8px; }
    .meta div { background: var(--panel-2, var(--bg)); border-radius: 8px; padding: 8px 10px; }
    .meta span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .meta p { margin: 4px 0 0; font-size: 13px; word-break: break-word; }
  </style>
</head>
<body>
  <div class="bar"><a href="../../">← Home</a></div>
  <div class="wrap">
    <h1>Meta Tag / Favicon Extractor</h1>
    <p class="sub">Paste a URL to preview its title, description, thumbnail, and favicon.</p>
    <label for="url">URL</label>
    <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com" />
    <div class="row">
      <button type="button" class="primary" id="go">Fetch</button>
    </div>
    <p class="err" id="err"></p>
    <article class="card" id="card">
      <img class="thumb empty" id="thumb" alt="" />
      <div class="body">
        <div class="title-row">
          <img class="favicon" id="fav" alt="" />
          <div>
            <h2 id="title">Title</h2>
            <p class="desc" id="desc"></p>
          </div>
        </div>
        <div class="meta">
          <div><span>Title</span><p id="title2"></p></div>
          <div><span>Description</span><p id="desc2"></p></div>
          <div><span>Favicon</span><p id="favurl"></p></div>
          <div><span>Image</span><p id="imgurl"></p></div>
        </div>
      </div>
    </article>
  </div>
  <script>
    (function () {
      const input = document.getElementById("url");
      const err = document.getElementById("err");
      const card = document.getElementById("card");
      const go = document.getElementById("go");

      function normalize(raw) {
        const t = String(raw || "").trim();
        if (!t) return "";
        if (/^[a-z][a-z0-9+.-]*:/i.test(t)) return t;
        return "https://" + t;
      }
      function hostOf(u) {
        try { return new URL(u).hostname; } catch (e) { return ""; }
      }
      function attr(el, name) {
        return (el.getAttribute(name) || "").trim();
      }
      function abs(base, href) {
        if (!href) return "";
        try { return new URL(href, base).href; } catch (e) { return href; }
      }
      function favFallback(u) {
        const h = hostOf(u);
        return h ? "https://www.google.com/s2/favicons?sz=128&domain=" + encodeURIComponent(h) : "";
      }

      async function fromMicrolink(url) {
        const res = await fetch("https://api.microlink.io?url=" + encodeURIComponent(url));
        if (!res.ok) throw new Error("microlink " + res.status);
        const j = await res.json();
        if (j.status !== "success" || !j.data) throw new Error("microlink");
        const d = j.data;
        return {
          title: d.title || hostOf(url),
          description: d.description || "",
          image: (d.image && d.image.url) || "",
          favicon: (d.logo && d.logo.url) || favFallback(url)
        };
      }

      function parseHtml(url, html) {
        const doc = new DOMParser().parseFromString(html, "text/html");
        const metas = Array.from(doc.querySelectorAll("meta"));
        function meta(keys) {
          for (let i = 0; i < keys.length; i++) {
            const key = keys[i];
            const el = metas.find(function (m) {
              return (attr(m, "property") || attr(m, "name") || "").toLowerCase() === key;
            });
            if (el && attr(el, "content")) return attr(el, "content");
          }
          return "";
        }
        const icon = doc.querySelector('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
        return {
          title: (doc.querySelector("title") && doc.querySelector("title").textContent.trim()) || meta(["og:title", "twitter:title"]) || hostOf(url),
          description: meta(["og:description", "description", "twitter:description"]),
          image: abs(url, meta(["og:image", "twitter:image"])),
          favicon: abs(url, icon ? attr(icon, "href") : "") || favFallback(url)
        };
      }

      async function fromHtml(url) {
        const proxies = [
          "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
          "https://corsproxy.io/?" + encodeURIComponent(url)
        ];
        let last = null;
        for (let i = 0; i < proxies.length; i++) {
          try {
            const res = await fetch(proxies[i]);
            if (!res.ok) throw new Error("proxy " + res.status);
            const html = await res.text();
            return parseHtml(url, html);
          } catch (e) { last = e; }
        }
        throw last || new Error("proxy");
      }

      function paint(data) {
        document.getElementById("title").textContent = data.title || "Untitled";
        document.getElementById("title2").textContent = data.title || "—";
        document.getElementById("desc").textContent = data.description || "";
        document.getElementById("desc2").textContent = data.description || "—";
        document.getElementById("favurl").textContent = data.favicon || "—";
        document.getElementById("imgurl").textContent = data.image || "—";
        const fav = document.getElementById("fav");
        fav.src = data.favicon || "";
        fav.style.display = data.favicon ? "block" : "none";
        const thumb = document.getElementById("thumb");
        if (data.image) {
          thumb.src = data.image;
          thumb.classList.remove("empty");
        } else {
          thumb.removeAttribute("src");
          thumb.classList.add("empty");
        }
        card.classList.add("show");
      }

      async function run() {
        err.textContent = "";
        const url = normalize(input.value);
        if (!url) { err.textContent = "Add a URL first."; return; }
        go.disabled = true;
        try {
          let data;
          try { data = await fromMicrolink(url); }
          catch (e) { data = await fromHtml(url); }
          paint(data);
        } catch (e) {
          err.textContent = "Couldn’t read that page. Some sites block lookups.";
          card.classList.remove("show");
        }
        go.disabled = false;
      }

      go.onclick = run;
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); run(); }
      });
    })();
  </script>
</body>
</html>
