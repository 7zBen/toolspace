<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clock</title>
  <meta name="description" content="A full-screen live clock." />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Ccircle cx='8' cy='8' r='4.2' fill='none' stroke='%236ea8ff' stroke-width='1.5'/%3E%3Cpath d='M8 5.2V8l2 1.4' fill='none' stroke='%236ea8ff' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#0f1115; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; --line:#2a3140; --clock:#e8edf5; --hand:#e8edf5; --sec:#fb7185; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--clock-bg, var(--bg));
    }
    .bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; color: var(--muted); font-size: 13px;
    }
    .bar a { color: var(--muted); text-decoration: none; }
    .bar a:hover { color: var(--accent); }
    .bar button {
      appearance: none; background: var(--panel, transparent); border: 1px solid var(--line);
      color: var(--text); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .stage { flex: 1; display: grid; place-items: center; padding: 24px 20px 48px; text-align: center; }
    .stage > div { display: flex; flex-direction: column; align-items: center; }
    .digital { display: inline-flex; align-items: flex-start; justify-content: center; gap: .28em; }
    .hm {
      font-variant-numeric: tabular-nums;
      font-weight: 560;
      letter-spacing: .02em;
      font-size: clamp(52px, 14vw, 160px);
      line-height: .95;
    }
    .subsec {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: .18em;
      min-width: 2.6ch;
    }
    .secs {
      font-variant-numeric: tabular-nums;
      font-size: clamp(22px, 5.4vw, 54px);
      color: var(--muted);
      font-weight: 500;
      letter-spacing: .04em;
      line-height: 1;
    }
    .ampm {
      font-size: clamp(12px, 2vw, 18px);
      color: var(--muted);
      text-transform: lowercase;
      margin-top: .25em;
      min-height: 1.2em;
    }
    .date { margin: 18px 0 0; color: var(--muted); font-size: clamp(16px, 2.4vw, 26px); }
    .analog {
      width: min(72vw, 420px);
      height: auto;
      display: none;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,.28));
    }
    body.is-analog .digital { display: none; }
    body.is-analog .analog { display: block; }
    .dial { fill: color-mix(in srgb, var(--panel, #171a21) 82%, transparent); stroke: var(--line); stroke-width: 3; }
    .tick { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
    .tick.major { stroke: var(--text); stroke-width: 3; }
    .hand { stroke: var(--hand); stroke-linecap: round; }
    .hand.hour { stroke-width: 7; }
    .hand.min { stroke-width: 5; }
    .hand.sec { stroke: var(--sec); stroke-width: 2; }
    .cap { fill: var(--sec); }

    body[data-skin="0"] {
      --clock-bg:
        radial-gradient(1200px 600px at 20% -10%, #1d2a44 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 110%, #1a2438 0%, transparent 50%),
        var(--bg);
    }
    html[data-theme="light"] body[data-skin="0"] {
      --clock-bg:
        radial-gradient(1200px 600px at 20% -10%, #d7e3f6 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 110%, #e6edf8 0%, transparent 50%),
        var(--bg);
    }
    body[data-skin="1"] {
      --clock-bg:
        radial-gradient(900px 500px at 10% 0%, #7a2e12 0%, transparent 50%),
        linear-gradient(160deg, #1a0c08, #3b140c 55%, #0f1115);
      --accent: #ffb020; --sec: #ffb020;
    }
    html[data-theme="light"] body[data-skin="1"] {
      --clock-bg:
        radial-gradient(900px 500px at 10% 0%, #ffd7b0 0%, transparent 50%),
        linear-gradient(160deg, #fff4ea, #ffd0b0);
      --accent: #c2410c; --sec: #c2410c;
    }
    body[data-skin="2"] {
      --clock-bg:
        radial-gradient(800px 500px at 80% 10%, #14532d 0%, transparent 45%),
        linear-gradient(180deg, #052e16, #0f1115);
      --accent: #4ade80; --sec: #4ade80;
    }
    html[data-theme="light"] body[data-skin="2"] {
      --clock-bg:
        radial-gradient(800px 500px at 80% 10%, #bbf7d0 0%, transparent 45%),
        linear-gradient(180deg, #ecfdf3, #d1fae5);
      --accent: #15803d; --sec: #15803d;
    }
    body[data-skin="3"] {
      --clock-bg:
        radial-gradient(600px 400px at 20% 80%, #5b21b6 0%, transparent 50%),
        radial-gradient(700px 400px at 90% 10%, #0e7490 0%, transparent 46%),
        #0b1020;
      --accent: #c084fc; --sec: #67e8f9;
    }
    html[data-theme="light"] body[data-skin="3"] {
      --clock-bg:
        radial-gradient(600px 400px at 20% 80%, #e9d5ff 0%, transparent 50%),
        radial-gradient(700px 400px at 90% 10%, #a5f3fc 0%, transparent 46%),
        #eef4ff;
      --accent: #7c3aed; --sec: #0891b2;
    }
    body[data-skin="4"] {
      --clock-bg:
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(110,168,255,.12) 31px 32px),
        repeating-linear-gradient(90deg, transparent 0 31px, rgba(110,168,255,.12) 31px 32px),
        #0c1220;
      --accent: #6ea8ff; --sec: #6ea8ff;
    }
    html[data-theme="light"] body[data-skin="4"] {
      --clock-bg:
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(59,111,212,.12) 31px 32px),
        repeating-linear-gradient(90deg, transparent 0 31px, rgba(59,111,212,.12) 31px 32px),
        #f4f7fb;
      --accent: #3b6fd4; --sec: #3b6fd4;
    }
  </style>
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site.js"></script>
</head>
<body data-skin="0">
  <div class="bar">
    <a href="../../">← Home</a>
    <button type="button" id="fmt">24h</button>
    <button type="button" class="icon-btn" id="analog" aria-label="Analog clock" title="Analog clock">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
    </button>
    <button type="button" class="icon-btn" id="skin" aria-label="Clock face" title="Clock face">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5-9.2 9.2a4 4 0 0 1-5.7-5.7L14.5 4.5z"/><path d="M12 19.5h8"/></svg>
    </button>
  </div>
  <div class="stage">
    <div>
      <div class="digital" id="digital">
        <span class="hm" id="hm">00:00</span>
        <span class="subsec">
          <span class="secs" id="secs">00</span>
          <span class="ampm" id="ampm"></span>
        </span>
      </div>
      <svg class="analog" id="analogFace" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="dial" cx="100" cy="100" r="96"/>
        <g id="ticks"></g>
        <line class="hand hour" id="hourHand" x1="100" y1="100" x2="100" y2="52"/>
        <line class="hand min" id="minHand" x1="100" y1="100" x2="100" y2="30"/>
        <line class="hand sec" id="secHand" x1="100" y1="112" x2="100" y2="22"/>
        <circle class="cap" cx="100" cy="100" r="5"/>
      </svg>
      <p class="date" id="date"></p>
    </div>
  </div>
  <script>
    (function () {
      const hmEl = document.getElementById("hm");
      const secsEl = document.getElementById("secs");
      const ampmEl = document.getElementById("ampm");
      const dateEl = document.getElementById("date");
      const fmtBtn = document.getElementById("fmt");
      const analogBtn = document.getElementById("analog");
      const skinBtn = document.getElementById("skin");
      const hourHand = document.getElementById("hourHand");
      const minHand = document.getElementById("minHand");
      const secHand = document.getElementById("secHand");
      let hour12 = localStorage.getItem("clock-12") === "1";
      let analog = localStorage.getItem("clock-analog") === "1";
      let skin = parseInt(localStorage.getItem("clock-skin") || "0", 10) || 0;
      if (skin < 0 || skin > 4) skin = 0;

      const ticks = document.getElementById("ticks");
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * Math.PI * 2;
        const inner = i % 5 === 0 ? 78 : 86;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("class", "tick" + (i % 5 === 0 ? " major" : ""));
        line.setAttribute("x1", String(100 + Math.sin(a) * inner));
        line.setAttribute("y1", String(100 - Math.cos(a) * inner));
        line.setAttribute("x2", String(100 + Math.sin(a) * 92));
        line.setAttribute("y2", String(100 - Math.cos(a) * 92));
        ticks.appendChild(line);
      }

      function pad(n) { return String(n).padStart(2, "0"); }
      function setHand(el, deg) {
        el.setAttribute("transform", "rotate(" + deg + " 100 100)");
      }
      function applySkin() {
        document.body.setAttribute("data-skin", String(skin));
        localStorage.setItem("clock-skin", String(skin));
      }
      function applyAnalog() {
        document.body.classList.toggle("is-analog", analog);
        analogBtn.setAttribute("aria-pressed", analog ? "true" : "false");
        localStorage.setItem("clock-analog", analog ? "1" : "0");
      }

      function tick() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const ms = now.getMilliseconds();
        if (hour12) {
          ampmEl.textContent = hours >= 12 ? "pm" : "am";
          hours = hours % 12 || 12;
          hmEl.textContent = hours + ":" + pad(minutes);
        } else {
          ampmEl.textContent = "";
          hmEl.textContent = pad(hours) + ":" + pad(minutes);
        }
        secsEl.textContent = pad(seconds);
        dateEl.textContent = now.toLocaleDateString(undefined, {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
        fmtBtn.textContent = hour12 ? "12h" : "24h";
        const s = seconds + ms / 1000;
        const m = minutes + s / 60;
        const h = (now.getHours() % 12) + m / 60;
        setHand(secHand, s * 6);
        setHand(minHand, m * 6);
        setHand(hourHand, h * 30);
      }

      fmtBtn.addEventListener("click", function () {
        hour12 = !hour12;
        localStorage.setItem("clock-12", hour12 ? "1" : "0");
        tick();
      });
      analogBtn.addEventListener("click", function () {
        analog = !analog;
        applyAnalog();
      });
      skinBtn.addEventListener("click", function () {
        skin = (skin + 1) % 5;
        applySkin();
      });

      applySkin();
      applyAnalog();
      tick();
      setInterval(tick, 50);
    })();
  </script>
</body>
</html>
