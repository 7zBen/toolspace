<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Link to QR</title>
  <meta name="description" content="Turn a link into a QR code. Stays on this device." />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%236ea8ff'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%236ea8ff'/%3E%3Crect x='3' y='9' width='4' height='4' fill='%236ea8ff'/%3E%3Crect x='10' y='10' width='2' height='2' fill='%236ea8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site.js"></script>
  <script src="../../shared/qrcode.min.js"></script>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; padding-left: max(18px, env(safe-area-inset-left)); }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .wrap { width: min(520px, calc(100% - 24px)); margin: 0 auto 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input[type="url"], textarea {
      width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 14px; cursor: pointer; font: inherit; font-size: 13px;
    }
    button.primary { background: var(--accent); border-color: transparent; color: #fff; }
    .card {
      margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px; text-align: center;
    }
    #qrbox {
      display: grid; place-items: center; min-height: 180px;
      background: #fff; border-radius: 12px; padding: 16px; margin: 0 auto;
      width: min(280px, 100%);
    }
    #qrbox img, #qrbox canvas { width: 100%; height: auto; image-rendering: pixelated; }
    .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
    .err { color: #e11d48; font-size: 13px; margin-top: 8px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="bar"><a href="../../">← Home</a></div>
  <div class="wrap">
    <h1>Link to QR</h1>
    <p class="sub">Paste a URL. The code is built in your browser — nothing is uploaded.</p>
    <label for="url">Link</label>
    <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com" />
    <div class="row">
      <button type="button" class="primary" id="make">Make QR</button>
      <button type="button" id="dl">Download PNG</button>
    </div>
    <p class="err" id="err"></p>
    <div class="card">
      <div id="qrbox"></div>
      <p class="hint" id="hint">Enter a link to generate a code.</p>
    </div>
  </div>
  <script>
    (function () {
      const input = document.getElementById("url");
      const box = document.getElementById("qrbox");
      const err = document.getElementById("err");
      const hint = document.getElementById("hint");
      let lastUrl = "";

      function normalize(raw) {
        const t = String(raw || "").trim();
        if (!t) return "";
        if (/^[a-z][a-z0-9+.-]*:/i.test(t)) return t;
        return "https://" + t;
      }

      function draw(url) {
        err.textContent = "";
        if (!url) { err.textContent = "Add a link first."; return; }
        if (typeof qrcode !== "function") { err.textContent = "QR library failed to load."; return; }
        if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) {
          qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
        }
        try {
          const qr = qrcode(0, "M");
          qr.addData(url);
          qr.make();
          const size = qr.getModuleCount();
          const scale = Math.max(6, Math.floor(280 / (size + 8)));
          const canvas = document.createElement("canvas");
          canvas.width = (size + 8) * scale;
          canvas.height = canvas.width;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#111";
          for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
            if (qr.isDark(r, c)) ctx.fillRect((c + 4) * scale, (r + 4) * scale, scale, scale);
          }
          box.textContent = "";
          box.appendChild(canvas);
          lastUrl = url;
          hint.textContent = url;
        } catch (e) {
          err.textContent = "Couldn’t build a code for that text.";
        }
      }

      document.getElementById("make").onclick = function () { draw(normalize(input.value)); };
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); draw(normalize(input.value)); }
      });
      document.getElementById("dl").onclick = function () {
        const canvas = box.querySelector("canvas");
        if (!canvas) { err.textContent = "Make a QR first."; return; }
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = "qr.png";
        a.click();
      };
    })();
  </script>
</body>
</html>
