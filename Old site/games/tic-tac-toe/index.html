<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tic Tac Toe</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Cpath d='M4 4l8 8M12 4L4 12' stroke='%236ea8ff' stroke-width='1.8'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; --good:#3dd68c; --bad:#fb7185; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    .bar { display: flex; justify-content: space-between; padding: 14px 18px; }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .wrap { width: min(380px, calc(100% - 32px)); margin: 0 auto 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .modes { display: flex; gap: 8px; margin-bottom: 12px; }
    .modes button, .actions button {
      flex: 1; appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 9px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .modes button.on { border-color: var(--accent); color: var(--accent); }
    .status { text-align: center; margin: 0 0 12px; min-height: 1.4em; color: var(--muted); }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button.cell {
      aspect-ratio: 1; border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 14px; font-size: 48px; cursor: pointer; font-family: inherit;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    button.cell.pop { transform: none; }
    button.cell:disabled { cursor: default; }
    button.cell.win { background: var(--cell-win); border-color: var(--good); color: var(--good); box-shadow: 0 0 0 2px var(--good); }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
  </style>
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site.js"></script>
</head>
<body>
  <div class="bar"><a href="../../">← Home</a></div>
  <div class="wrap">
    <h1>Tic Tac Toe</h1>
    <p class="sub" id="blurb">Two players on this device. X starts.</p>
    <div class="modes">
      <button type="button" id="pvp" class="on">Two players</button>
      <button type="button" id="cpu">vs Computer</button>
    </div>
    <p class="status" id="status">X to play</p>
    <div class="board" id="board"></div>
    <div class="actions"><button type="button" id="restart">New game</button></div>
  </div>
  <script>
    (function () {
      const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const blurb = document.getElementById("blurb");
      let board, lock, ended, ignoreTap, turn, vsCpu = false, cells = [], audioCtx, master;

      for (let i = 0; i < 9; i++) {
        const b = document.createElement("button");
        b.className = "cell";
        b.type = "button";
        b.addEventListener("click", function () { play(i); });
        boardEl.appendChild(b);
        cells.push(b);
      }

      function unlock() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          master = audioCtx.createGain();
          master.gain.value = 0.16;
          master.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
      function beep(freq, dur, type, vol, slide) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
        g.gain.setValueAtTime(vol || 0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.02);
      }

      function winner(b) {
        for (let i = 0; i < LINES.length; i++) {
          const L = LINES[i], a = b[L[0]];
          if (a && a === b[L[1]] && a === b[L[2]]) return { who: a, line: L };
        }
        if (b.every(Boolean)) return { who: "draw", line: null };
        return null;
      }

      function minimax(b, maxing) {
        const w = winner(b);
        if (w) return w.who === "O" ? 10 : w.who === "X" ? -10 : 0;
        let best = maxing ? -99 : 99;
        for (let i = 0; i < 9; i++) {
          if (b[i]) continue;
          b[i] = maxing ? "O" : "X";
          const v = minimax(b, !maxing);
          b[i] = "";
          best = maxing ? Math.max(best, v) : Math.min(best, v);
        }
        return best;
      }

      function aiMove() {
        const scored = [];
        for (let i = 0; i < 9; i++) {
          if (board[i]) continue;
          board[i] = "O";
          const v = minimax(board, false);
          board[i] = "";
          scored.push({ i: i, v: v });
        }
        scored.sort(function (a, b) { return b.v - a.v; });
        let pick = scored[0];
        if (scored.length > 1 && Math.random() < 0.22) pick = scored[1];
        stamp(pick.i, "O");
      }

      function stamp(i, who) {
        board[i] = who;
        cells[i].textContent = who;
        cells[i].disabled = true;
        cells[i].classList.add("pop");
        setTimeout(function () { cells[i].classList.remove("pop"); }, 140);
        beep(who === "X" ? 440 : 330, 0.08, "triangle", 0.1);
      }

      function finish(w) {
        lock = true;
        ended = true;
        ignoreTap = true;
        setTimeout(function () { ignoreTap = false; }, 450);
        if (w.who === "draw") {
          statusEl.textContent = "Draw · tap to play again";
          beep(180, 0.25, "sine", 0.1, 90);
        } else {
          statusEl.textContent = w.who + " wins · tap to play again";
          beep(523, 0.12, "sine", 0.12); beep(659, 0.18, "triangle", 0.1); beep(784, 0.24, "sine", 0.1);
        }
        if (w.line) w.line.forEach(function (i) { cells[i].classList.add("win"); });
        cells.forEach(function (c) { c.disabled = false; });
      }

      function play(i) {
        if (ended) {
          if (ignoreTap) return;
          reset();
          return;
        }
        if (lock || board[i]) return;
        unlock();
        stamp(i, turn);
        let w = winner(board);
        if (w) return finish(w);
        turn = turn === "X" ? "O" : "X";
        if (vsCpu && turn === "O") {
          lock = true;
          statusEl.textContent = "Computer…";
          setTimeout(function () {
            aiMove();
            w = winner(board);
            if (w) return finish(w);
            turn = "X";
            lock = false;
            statusEl.textContent = "Your move (X)";
          }, 280);
        } else {
          statusEl.textContent = turn + " to play";
        }
      }

      function reset() {
        board = ["","","","","","","","",""];
        lock = false; ended = false; ignoreTap = false; turn = "X";
        statusEl.textContent = vsCpu ? "Your move (X)" : "X to play";
        cells.forEach(function (c) { c.textContent = ""; c.disabled = false; c.classList.remove("win", "pop"); });
      }

      function setMode(cpu) {
        vsCpu = cpu;
        document.getElementById("pvp").classList.toggle("on", !cpu);
        document.getElementById("cpu").classList.toggle("on", cpu);
        blurb.textContent = cpu
          ? "You are X. Computer is strong — a draw is a good result, winning is possible if it slips."
          : "Two players on this device. X starts.";
        reset();
      }
      document.getElementById("pvp").onclick = function () { setMode(false); };
      document.getElementById("cpu").onclick = function () { setMode(true); };
      document.getElementById("restart").onclick = reset;
      window.addEventListener("click", function (e) {
        if (!ended || ignoreTap) return;
        if (e.target.closest(".modes, .actions, .bar")) return;
        reset();
      });
      reset();
    })();
  </script>
</body>
</html>
