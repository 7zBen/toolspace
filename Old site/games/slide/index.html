<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Slide</title>
  <meta name="description" content="Join the tiles." />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Crect x='2.5' y='2.5' width='5' height='5' rx='1' fill='%236ea8ff'/%3E%3Crect x='8.5' y='2.5' width='5' height='5' rx='1' fill='%233dd68c'/%3E%3Crect x='2.5' y='8.5' width='11' height='5' rx='1' fill='%23ffb020'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #2a3140; --text: #e8edf5;
      --muted: #8b95a8; --accent: #6ea8ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; touch-action: none; overflow-x: hidden; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .bar button, button.full {
      appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .wrap { width: min(420px, calc(100% - 32px)); margin: 0 auto; padding-bottom: 40px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .hud { display: flex; gap: 8px; margin-bottom: 14px; }
    .stat { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .board {
      position: relative; width: 100%; aspect-ratio: 1; background: var(--line);
      border: 1px solid var(--line); border-radius: 16px; padding: 8px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
      gap: 8px; width: 100%; height: 100%;
    }
    .slot { background: var(--panel); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); }
    .layer { position: absolute; inset: 8px; }
    .tile {
      position: absolute; border-radius: 10px; display: grid; place-items: center;
      font-weight: 700; color: #0f1115; z-index: 1;
      width: calc((100% - 24px) / 4); height: calc((100% - 24px) / 4);
      transition: left 120ms ease-out, top 120ms ease-out, transform 140ms ease;
      box-shadow: 0 4px 0 rgba(0,0,0,.18);
    }
    .tile.spawn { transform: scale(0); }
    .tile.pop { transform: scale(1.12); z-index: 2; }
    .overlay {
      position: absolute; inset: 0; border-radius: 16px; display: none;
      place-items: center; background: rgba(15,17,21,.72); text-align: center; z-index: 5;
    }
    .overlay.show { display: grid; }
    button.full { width: 100%; margin-top: 14px; border-radius: 10px; padding: 10px; }
  </style>
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site.js"></script>
</head>
<body>
  <div class="bar">
    <a href="../../">← Home</a>
    <button type="button" id="mute">Sound on</button>
  </div>
  <div class="wrap">
    <h1>Slide</h1>
    <p class="sub">Arrow keys or swipe. Combine matching tiles.</p>
    <div class="hud">
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span>Best</span><b id="best">0</b></div>
    </div>
    <div class="board" id="board">
      <div class="grid" id="slots"></div>
      <div class="layer" id="layer"></div>
      <div class="overlay" id="over"><div id="overTitle">Game over</div></div>
    </div>
    <button class="full" type="button" id="restart">New game</button>
  </div>
  <script>
    (function () {
      const N = 4;
      const COLORS = {
        2: "#c5d4ea", 4: "#8fb4e8", 8: "#6ea8ff", 16: "#3d7dff",
        32: "#3dd68c", 64: "#22c55e", 128: "#ffb020", 256: "#f59e0b",
        512: "#fb7185", 1024: "#c084fc", 2048: "#e8edf5", 4096: "#ffffff"
      };
      const layer = document.getElementById("layer");
      const overEl = document.getElementById("over");
      const muteBtn = document.getElementById("mute");
      const slotsEl = document.getElementById("slots");
      for (let i = 0; i < 16; i++) {
        const s = document.createElement("div");
        s.className = "slot";
        slotsEl.appendChild(s);
      }

      let tiles = [], nextId = 1, score = 0, best, muted, audioCtx, master, busy = false, won = false;
      best = parseInt(localStorage.getItem("slide-best") || "0", 10) || 0;
      muted = localStorage.getItem("slide-mute") === "1";
      document.getElementById("best").textContent = String(best);
      setMuteIcon(muteBtn, muted);

      function unlockAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          master = audioCtx.createGain();
          master.connect(audioCtx.destination);
          master.gain.value = muted ? 0 : 0.2;
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
      window.addEventListener("pointerdown", unlockAudio, { once: true });
      window.addEventListener("keydown", unlockAudio, { once: true });

      function tone(freq, dur, type, vol, slideTo) {
        if (!audioCtx || muted) return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || "square";
        o.frequency.setValueAtTime(freq, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(vol || 0.1, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.02);
      }
      function sfx(kind, n) {
        if (kind === "move") tone(180 + Math.random() * 40, 0.05, "triangle", 0.06);
        if (kind === "merge") { tone(280 + Math.log2(n || 4) * 18, 0.12, "square", 0.1, 480); }
        if (kind === "spawn") tone(520, 0.06, "sine", 0.04);
        if (kind === "over") tone(220, 0.3, "triangle", 0.1, 70);
        if (kind === "win") { tone(440, 0.12, "sine", 0.1, 660); tone(660, 0.2, "triangle", 0.08); }
      }

      function place(el, r, c) {
        el.style.left = "calc(" + c + " * ((100% - 24px) / 4 + 8px))";
        el.style.top = "calc(" + r + " * ((100% - 24px) / 4 + 8px))";
      }
      function paint(tile) {
        tile.el.textContent = String(tile.v);
        tile.el.style.background = COLORS[tile.v] || "#e8edf5";
        tile.el.style.fontSize = tile.v >= 1024 ? "18px" : tile.v >= 128 ? "22px" : "28px";
      }
      function hud() {
        document.getElementById("score").textContent = String(score);
        document.getElementById("best").textContent = String(best);
      }
      function occupiedMap() {
        const m = {};
        tiles.forEach(function (t) { m[t.r + "," + t.c] = t; });
        return m;
      }
      function emptyCells() {
        const used = occupiedMap();
        const out = [];
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!used[r + "," + c]) out.push([r, c]);
        return out;
      }
      function canMove() {
        if (emptyCells().length) return true;
        const m = occupiedMap();
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          const t = m[r + "," + c];
          if (!t) continue;
          const right = m[r + "," + (c + 1)], down = m[(r + 1) + "," + c];
          if ((right && right.v === t.v) || (down && down.v === t.v)) return true;
        }
        return false;
      }

      function spawn(animate) {
        const spots = emptyCells();
        if (!spots.length) return;
        const p = spots[Math.floor(Math.random() * spots.length)];
        const tile = { id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r: p[0], c: p[1] };
        const el = document.createElement("div");
        el.className = "tile" + (animate ? " spawn" : "");
        place(el, tile.r, tile.c);
        tile.el = el;
        paint(tile);
        layer.appendChild(el);
        tiles.push(tile);
        if (animate) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { el.classList.remove("spawn"); });
          });
          sfx("spawn");
        }
      }

      function move(dir) {
        if (busy || overEl.classList.contains("show")) return;
        const dr = dir === "up" ? -1 : dir === "down" ? 1 : 0;
        const dc = dir === "left" ? -1 : dir === "right" ? 1 : 0;
        tiles.sort(function (a, b) {
          return (b.r - a.r) * dr + (b.c - a.c) * dc;
        });
        const occupied = {};
        const merged = {};
        let moved = false;
        let mergedVal = 0;

        tiles.forEach(function (tile) {
          let r = tile.r, c = tile.c;
          while (true) {
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nc < 0 || nr >= N || nc >= N) break;
            const hit = occupied[nr + "," + nc];
            if (!hit) { r = nr; c = nc; continue; }
            if (hit.v === tile.v && !merged[hit.id]) {
              r = nr; c = nc;
              hit.v *= 2;
              score += hit.v;
              mergedVal = Math.max(mergedVal, hit.v);
              merged[hit.id] = true;
              tile.dead = true;
              tile.mergeTo = hit;
              moved = true;
            }
            break;
          }
          if (!tile.dead) {
            if (r !== tile.r || c !== tile.c) moved = true;
            tile.r = r; tile.c = c;
            occupied[r + "," + c] = tile;
          } else {
            tile.r = r; tile.c = c;
          }
        });

        if (!moved) return;
        busy = true;
        if (mergedVal) sfx("merge", mergedVal); else sfx("move");
        if (score > best) { best = score; localStorage.setItem("slide-best", String(best)); }
        hud();

        tiles.forEach(function (tile) {
          place(tile.el, tile.r, tile.c);
          if (tile.dead) {
            tile.el.style.zIndex = "0";
            setTimeout(function () { if (tile.el.parentNode) tile.el.remove(); }, 120);
          } else if (merged[tile.id]) {
            paint(tile);
            tile.el.classList.add("pop");
            setTimeout(function () { tile.el.classList.remove("pop"); }, 160);
          }
        });
        tiles = tiles.filter(function (t) { return !t.dead; });

        setTimeout(function () {
          spawn(true);
          busy = false;
          if (!won && tiles.some(function (t) { return t.v >= 2048; })) {
            won = true;
            sfx("win");
          }
          if (!canMove()) {
            sfx("over");
            document.getElementById("overTitle").textContent = "Game over · " + score;
            overEl.classList.add("show");
          }
        }, 130);
      }

      function reset() {
        tiles.forEach(function (t) { t.el.remove(); });
        tiles = []; nextId = 1; score = 0; won = false; busy = false;
        overEl.classList.remove("show");
        spawn(false); spawn(false);
        hud();
      }

      const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down" };
      window.addEventListener("keydown", function (e) {
        if (overEl.classList.contains("show")) {
          e.preventDefault();
          reset();
          return;
        }
        const d = map[e.key];
        if (!d) return;
        e.preventDefault();
        unlockAudio();
        move(d);
      });
      let sx = 0, sy = 0;
      document.getElementById("board").addEventListener("touchstart", function (e) {
        sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY;
      }, { passive: true });
      document.getElementById("board").addEventListener("touchend", function (e) {
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        unlockAudio();
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
        else move(dy > 0 ? "down" : "up");
      });
      muteBtn.onclick = function () {
        unlockAudio();
        muted = !muted;
        localStorage.setItem("slide-mute", muted ? "1" : "0");
        setMuteIcon(muteBtn, muted);
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.2, audioCtx.currentTime, 0.02);
      };
      document.getElementById("restart").onclick = reset;
      reset();
    })();
  </script>
</body>
</html>
