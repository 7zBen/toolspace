<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Simon Says</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%236ea8ff' stroke-width='1.5'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar { display: flex; justify-content: space-between; padding: 14px 18px; }
    .bar a, .bar button { font-size: 13px; }
    .bar a { color: var(--muted); text-decoration: none; }
    .bar a:hover { color: var(--accent); }
    .bar button, .actions button {
      appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit;
    }
    .wrap { width: min(420px, calc(100% - 32px)); margin: 0 auto 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .hud { display: flex; gap: 8px; margin-bottom: 16px; }
    .stat { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .stat b { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .pad {
      width: min(320px, 100%); aspect-ratio: 1; margin: 0 auto; border-radius: 50%;
      display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border: 10px solid var(--pad-ring);
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    .b { border: 0; cursor: pointer; opacity: .45; transition: opacity 80ms, filter 80ms; }
    .b:nth-child(1) { background: #fb7185; }
    .b:nth-child(2) { background: #6ea8ff; }
    .b:nth-child(3) { background: #ffb020; }
    .b:nth-child(4) { background: #3dd68c; }
    .b.hl { opacity: 1; filter: brightness(1.15); }
    .pad.locked .b { cursor: default; }
    .status { text-align: center; margin: 14px 0; color: var(--muted); min-height: 1.4em; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; border-radius: 10px; padding: 10px; }
  </style>
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site.js"></script>
</head>
<body>
  <div class="bar">
    <a href="../../">← Home</a>
    <button type="button" id="mute">Sound on</button>
  </div>
  <div class="wrap">
    <h1>Simon Says</h1>
    <p class="sub">Watch the sequence, then tap it back.</p>
    <div class="hud">
      <div class="stat"><span>Round</span><b id="round">0</b></div>
      <div class="stat"><span>Best</span><b id="best">0</b></div>
    </div>
    <div class="pad" id="pad">
      <button class="b" type="button" data-i="0" aria-label="red"></button>
      <button class="b" type="button" data-i="1" aria-label="blue"></button>
      <button class="b" type="button" data-i="2" aria-label="yellow"></button>
      <button class="b" type="button" data-i="3" aria-label="green"></button>
    </div>
    <p class="status" id="status">Press start</p>
    <div class="actions"><button type="button" id="start">Start</button></div>
  </div>
  <script>
    (function () {
      const FREQ = [329.6, 261.6, 392.0, 220.0];
      const pads = [].slice.call(document.querySelectorAll(".b"));
      const padEl = document.getElementById("pad");
      const statusEl = document.getElementById("status");
      const muteBtn = document.getElementById("mute");
      let seq = [], user = [], playing = false, locked = true, muted, audioCtx, master;
      let best = parseInt(localStorage.getItem("simon-best") || "0", 10) || 0;
      muted = localStorage.getItem("simon-mute") === "1";
      document.getElementById("best").textContent = String(best);
      setMuteIcon(muteBtn, muted);

      function unlockAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          master = audioCtx.createGain();
          master.connect(audioCtx.destination);
          master.gain.value = muted ? 0 : 0.18;
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
      function tone(i, dur) {
        if (!audioCtx || muted) return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "square";
        o.frequency.value = FREQ[i];
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur);
      }
      function flash(i, dur) {
        pads[i].classList.add("hl");
        tone(i, (dur || 280) / 1000);
        return new Promise(function (res) {
          setTimeout(function () { pads[i].classList.remove("hl"); res(); }, dur || 280);
        });
      }
      async function playSeq() {
        locked = true;
        padEl.classList.add("locked");
        statusEl.textContent = "Watch";
        document.getElementById("round").textContent = String(seq.length);
        await new Promise(function (r) { setTimeout(r, 400); });
        for (let i = 0; i < seq.length; i++) {
          await flash(seq[i], 320);
          await new Promise(function (r) { setTimeout(r, 140); });
        }
        user = [];
        locked = false;
        padEl.classList.remove("locked");
        statusEl.textContent = "Your turn";
      }
      function start() {
        unlockAudio();
        playing = true;
        seq = [];
        seq.push(Math.floor(Math.random() * 4));
        playSeq();
      }
      pads.forEach(function (p) {
        p.addEventListener("click", function () {
          if (locked || !playing) return;
          unlockAudio();
          const i = +p.dataset.i;
          flash(i, 200);
          user.push(i);
          const n = user.length - 1;
          if (user[n] !== seq[n]) {
            playing = false;
            locked = true;
            padEl.classList.add("locked");
            statusEl.textContent = "Wrong — round " + seq.length;
            if (seq.length > best) {
              best = seq.length;
              localStorage.setItem("simon-best", String(best));
              document.getElementById("best").textContent = String(best);
            }
            return;
          }
          if (user.length === seq.length) {
            if (seq.length > best) {
              best = seq.length;
              localStorage.setItem("simon-best", String(best));
              document.getElementById("best").textContent = String(best);
            }
            locked = true;
            statusEl.textContent = "Nice";
            seq.push(Math.floor(Math.random() * 4));
            setTimeout(playSeq, 700);
          }
        });
      });
      muteBtn.onclick = function () {
        unlockAudio();
        muted = !muted;
        localStorage.setItem("simon-mute", muted ? "1" : "0");
        setMuteIcon(muteBtn, muted);
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.18, audioCtx.currentTime, 0.02);
      };
      document.getElementById("start").onclick = start;
    })();
  </script>
</body>
</html>
