<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Candy Crush</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Ccircle cx='5' cy='6' r='2.2' fill='%23fb7185'/%3E%3Ccircle cx='11' cy='6' r='2.2' fill='%236ea8ff'/%3E%3Ccircle cx='8' cy='11' r='2.2' fill='%23ffb020'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body { min-height: 100vh; overflow-x: hidden; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .bar button {
      appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .wrap { width: min(440px, calc(100% - 20px)); margin: 0 auto 40px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .hud { display: flex; gap: 8px; margin-bottom: 12px; }
    .stat { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
    .stat b { display: block; font-variant-numeric: tabular-nums; }
    .stat i { display: block; color: var(--muted); font-size: 11px; font-style: normal; }
    .stat span { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .board-wrap { position: relative; }
    .board {
      position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px;
      touch-action: none; overflow: hidden;
    }
    .cell {
      aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; background: var(--cell);
      cursor: pointer; z-index: 2; background-clip: padding-box;
    }
    .cell.on { box-shadow: 0 0 0 2px var(--accent) inset; }
    .piece {
      position: absolute; z-index: 3; display: grid; place-items: center; pointer-events: none;
      transition: left 180ms cubic-bezier(.2,.8,.2,1), top 200ms cubic-bezier(.2,.7,.2,1), transform 160ms ease;
    }
    .gem { position: relative; }
    .gem:after {
      content:""; position:absolute; left:16%; top:12%; width:38%; height:24%;
      background: rgba(255,255,255,.5); border-radius: 50%; pointer-events: none;
    }
    .t0 .gem {
      width: 48%; height: 42%; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffb3c0, #fb7185 46%, #be123c);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 3px 0 rgba(0,0,0,.16);
    }
    .t0 .twist {
      position: absolute; top: 32%; width: 18%; height: 36%;
      background: linear-gradient(#ff9aab, #e11d48);
      clip-path: polygon(0 50%, 100% 8%, 100% 92%);
    }
    .t0 .twist.l { left: 8%; }
    .t0 .twist.r { right: 8%; transform: scaleX(-1); }
    .t1 .gem {
      width: 70%; height: 70%; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #d6e8ff, #6ea8ff 42%, #1d4ed8);
      box-shadow: inset 0 -6px 0 rgba(0,0,0,.16), inset 0 5px 0 rgba(255,255,255,.28), 0 4px 0 rgba(0,0,0,.16);
    }
    .t2 .gem {
      width: 66%; height: 66%; border-radius: 26%;
      background: radial-gradient(circle at 32% 28%, #b6f5d0, #3dd68c 44%, #15803d);
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.16), inset 0 4px 0 rgba(255,255,255,.28), 0 4px 0 rgba(0,0,0,.16);
    }
    .t3 .gem {
      width: 52%; height: 74%;
      border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
      background: radial-gradient(circle at 50% 16%, #fffce8, #fde047 38%, #eab308 78%, #a16207);
      box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), 0 4px 0 rgba(0,0,0,.16);
    }
    .t4 .gem {
      width: 46%; height: 72%;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      background: radial-gradient(circle at 32% 24%, #efd0ff, #c084fc 46%, #7e22ce);
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.16), inset 0 4px 0 rgba(255,255,255,.28), 0 4px 0 rgba(0,0,0,.16);
      transform: rotate(-18deg);
    }
    .stripes {
      position: absolute; inset: 18%; pointer-events: none; z-index: 2; opacity: .95; border-radius: 8px;
    }
    .s1 .stripes {
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.92) 0 3px, transparent 3px 7px);
      mix-blend-mode: overlay;
    }
    .s2 .stripes {
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.92) 0 3px, transparent 3px 7px);
      mix-blend-mode: overlay;
    }
    .s3 .gem { transform: scale(.72); }
    .t4.s3 .gem { transform: rotate(-18deg) scale(.72); }
    .s3 .wrap {
      position: absolute; inset: 10%; border-radius: 50%;
      border: 3px solid #ffe08a;
      box-shadow: 0 0 10px #ffb020, inset 0 0 8px rgba(255,224,138,.8);
      background: conic-gradient(from 40deg, transparent 0 18%, rgba(255,224,138,.4) 0 26%, transparent 0 68%, rgba(255,224,138,.4) 0 76%, transparent 0);
    }
    .s3 .bow {
      position: absolute; top: 4%; width: 30%; height: 16%; background: #ffe08a; border-radius: 4px;
      box-shadow: 0 0 6px #ffb020;
    }
    .s4 .gem, .s4 .twist { display: none; }
    .s4 .bomb {
      width: 78%; height: 78%; border-radius: 50%; position: relative;
      background: conic-gradient(#fb7185, #ffb020, #3dd68c, #6ea8ff, #c084fc, #fb7185);
      animation: spin 1.6s linear infinite;
      box-shadow: 0 0 14px #ffb020, inset 0 0 0 3px rgba(15,17,21,.85);
    }
    .s4 .bomb:after {
      content:""; position:absolute; inset: 22%; background: #12151c; border-radius: 50%;
      box-shadow: inset 0 0 8px #ffb020;
    }
        @keyframes spin { to { transform: rotate(360deg); } }
    .piece.burst { animation: burst .22s ease forwards; z-index: 4; }
    @keyframes burst {
      0% { transform: scale(1); }
      40% { transform: scale(1.4); filter: brightness(1.4); }
      100% { transform: scale(0); opacity: 0; }
    }
    .piece.morph { animation: morph .34s ease; }
    @keyframes morph { 50% { transform: scale(1.28); filter: brightness(1.3); } }
    .fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
    .spark {
      position: absolute; width: 8px; height: 8px; border-radius: 50%;
      animation: spark .45s ease-out forwards;
    }
    @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
    .beam {
      position: absolute; background: linear-gradient(90deg, transparent, #fff, transparent);
      opacity: .85; border-radius: 99px; pointer-events: none;
      animation: fade .28s ease forwards;
    }
    .ring {
      position: absolute; border: 3px solid #ffe08a; border-radius: 50%;
      animation: ring .35s ease-out forwards;
    }
    @keyframes ring { to { transform: scale(2.2); opacity: 0; } }
    @keyframes fade { to { opacity: 0; } }
    .floater {
      position: absolute; font-weight: 800; color: #ffb020; font-size: 14px;
      text-shadow: 0 1px 0 #000; animation: rise .7s ease-out forwards; z-index: 7;
    }
    @keyframes rise { to { transform: translateY(-28px); opacity: 0; } }
    .overlay {
      position: absolute; inset: 0; border-radius: 16px; display: none;
      place-items: center; background: rgba(15,17,21,.78); text-align: center; z-index: 8; padding: 16px;
    }
    .overlay.show { display: grid; }
    .overlay b { display: block; font-size: 22px; margin-bottom: 4px; }
    .overlay span { color: var(--muted); font-size: 13px; }
    button.full {
      width: 100%; margin-top: 12px; appearance: none; background: var(--panel);
      border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px;
      cursor: pointer; font: inherit; font-size: 13px;
    }
  </style>
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site.js"></script>
</head>
<body>
  <div class="bar">
    <a href="../../">← Home</a>
    <button type="button" id="mute">Sound on</button>
  </div>
  <div class="wrap">
    <h1>Candy Crush</h1>
    <p class="sub">Swap neighbors to make 3 in a row. Hold and drag, or tap two candies.</p>
    <div class="hud">
      <div class="stat"><span>Level</span><b id="level">1</b><i id="best">best 1</i></div>
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span>Goal</span><b id="goal">2500</b></div>
      <div class="stat"><span>Moves</span><b id="moves">30</b></div>
    </div>
    <div class="board-wrap">
      <div class="board" id="board">
        <div class="fx" id="fx"></div>
      </div>
      <div class="overlay" id="over"><div><b id="overTitle">Clear</b><span id="overHint">Tap to continue</span></div></div>
    </div>
    <button class="full" type="button" id="restart">New game</button>
  </div>
  <script>
    (function () {
      const N = 7, KINDS = 5, GAP = 5;
      let grid, cells = [], pieces = {}, nextId = 1, selected = null, busy = false;
      let score, moves, goal, level, combo, muted, audioCtx, master, dragFrom = null, best;
      const boardEl = document.getElementById("board");
      const fxEl = document.getElementById("fx");
      const overEl = document.getElementById("over");
      const muteBtn = document.getElementById("mute");
      muted = localStorage.getItem("candy-mute") === "1";
      best = parseInt(localStorage.getItem("candy-best") || "1", 10) || 1;
      setMuteIcon(muteBtn, muted);

      for (let i = 0; i < N * N; i++) {
        const b = document.createElement("button");
        b.className = "cell";
        b.type = "button";
        const r = Math.floor(i / N), c = i % N;
        b.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          if (busy || overEl.classList.contains("show")) return;
          try { b.setPointerCapture(e.pointerId); } catch (err) {}
          dragFrom = { r: r, c: c };
          pick(r, c);
        });
        b.addEventListener("click", function (e) { e.preventDefault(); });
        boardEl.appendChild(b);
        cells.push(b);
      }
      boardEl.addEventListener("pointermove", function (e) {
        if (!dragFrom || busy) return;
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        const cell = hit && hit.closest ? hit.closest(".cell") : null;
        if (!cell || !boardEl.contains(cell)) return;
        const i = cells.indexOf(cell);
        if (i < 0) return;
        const r = Math.floor(i / N), c = i % N;
        if (r !== dragFrom.r || c !== dragFrom.c) trySwap(dragFrom.r, dragFrom.c, r, c);
      });
      boardEl.addEventListener("pointerup", function () { dragFrom = null; });
      boardEl.addEventListener("pointercancel", function () { dragFrom = null; });

      function idx(r, c) { return r * N + c; }
      function inside(r, c) { return r >= 0 && c >= 0 && r < N && c < N; }
      function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
      function candy() { return { t: Math.floor(Math.random() * KINDS), s: 0, id: nextId++ }; }

      function unlock() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          master = audioCtx.createGain();
          master.gain.value = muted ? 0 : 0.16;
          master.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
      function beep(freq, dur, type, vol, slide) {
        if (!audioCtx || muted) return;
        const t0 = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t0);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
        g.gain.setValueAtTime(vol || 0.1, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + dur + 0.02);
      }

      function hud() {
        document.getElementById("score").textContent = String(score);
        document.getElementById("moves").textContent = String(moves);
        document.getElementById("goal").textContent = String(goal);
        document.getElementById("level").textContent = String(level);
        document.getElementById("best").textContent = "best " + best;
      }

      function slotRect(r, c) {
        const rr = Math.max(0, Math.min(N - 1, r));
        const a = cells[idx(rr, c)].getBoundingClientRect();
        const b = boardEl.getBoundingClientRect();
        const s = a.width;
        return { x: a.left - b.left, y: a.top - b.top + (r - rr) * (s + GAP), s: s };
      }

      function stylePiece(el, x) {
        el.className = "piece t" + Math.max(0, x.t) + (x.s ? " s" + x.s : "");
        el.innerHTML = "";
        const gem = document.createElement("i");
        gem.className = "gem";
        el.appendChild(gem);
        if (x.t === 0 && x.s !== 4) {
          const l = document.createElement("i"); l.className = "twist l";
          const r = document.createElement("i"); r.className = "twist r";
          el.appendChild(l); el.appendChild(r);
        }
        if (x.s === 1 || x.s === 2) {
          const st = document.createElement("i");
          st.className = "stripes";
          el.appendChild(st);
        }
        if (x.s === 3) {
          const w = document.createElement("i");
          w.className = "wrap";
          el.appendChild(w);
          const bow = document.createElement("i");
          bow.className = "bow";
          el.appendChild(bow);
        }
        if (x.s === 4) {
          el.className = "piece s4";
          el.innerHTML = "";
          const bomb = document.createElement("i");
          bomb.className = "bomb";
          el.appendChild(bomb);
        }
      }

      function place(el, r, c, animate) {
        const p = slotRect(r, c);
        if (!animate) el.style.transition = "none";
        el.style.width = p.s + "px";
        el.style.height = p.s + "px";
        el.style.left = p.x + "px";
        el.style.top = p.y + "px";
        if (!animate) { el.getBoundingClientRect(); el.style.transition = ""; }
      }

      function makePiece(x, r, c, fromAbove) {
        const el = document.createElement("div");
        stylePiece(el, x);
        boardEl.appendChild(el);
        pieces[x.id] = el;
        if (fromAbove) {
          place(el, r - 3, c, false);
          requestAnimationFrame(function () { place(el, r, c, true); });
        } else {
          place(el, r, c, false);
        }
        return el;
      }

      function clearPieces() {
        Object.keys(pieces).forEach(function (id) { pieces[id].remove(); });
        pieces = {};
      }

      function syncPieces(animate) {
        const seen = {};
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          const x = grid[r][c];
          if (!x) continue;
          seen[x.id] = true;
          let el = pieces[x.id];
          if (!el) makePiece(x, r, c, animate);
          else {
            stylePiece(el, x);
            place(el, r, c, animate);
          }
        }
        Object.keys(pieces).forEach(function (id) {
          if (!seen[id]) { pieces[id].remove(); delete pieces[id]; }
        });
        cells.forEach(function (el, i) {
          const r = Math.floor(i / N), c = i % N;
          el.classList.toggle("on", selected && selected.r === r && selected.c === c);
        });
        hud();
      }

      function sparks(r, c, color, n) {
        const p = slotRect(r, c);
        for (let i = 0; i < n; i++) {
          const s = document.createElement("div");
          s.className = "spark";
          s.style.left = (p.x + p.s / 2) + "px";
          s.style.top = (p.y + p.s / 2) + "px";
          s.style.background = color;
          const a = Math.random() * Math.PI * 2, d = 12 + Math.random() * 28;
          s.style.setProperty("--dx", Math.cos(a) * d + "px");
          s.style.setProperty("--dy", Math.sin(a) * d + "px");
          fxEl.appendChild(s);
          setTimeout(function () { s.remove(); }, 450);
        }
      }

      function beam(kind, r, c) {
        const p = slotRect(r, c);
        const b = document.createElement("div");
        b.className = "beam";
        if (kind === 1) {
          const a = slotRect(r, 0), z = slotRect(r, N - 1);
          b.style.left = a.x + "px";
          b.style.top = (p.y + p.s / 2 - 3) + "px";
          b.style.width = (z.x + z.s - a.x) + "px";
          b.style.height = "6px";
        } else {
          const a = slotRect(0, c), z = slotRect(N - 1, c);
          b.style.left = (p.x + p.s / 2 - 3) + "px";
          b.style.top = a.y + "px";
          b.style.width = "6px";
          b.style.height = (z.y + z.s - a.y) + "px";
        }
        fxEl.appendChild(b);
        setTimeout(function () { b.remove(); }, 280);
      }

      function ringAt(r, c) {
        const p = slotRect(r, c);
        const d = document.createElement("div");
        d.className = "ring";
        d.style.left = p.x + "px";
        d.style.top = p.y + "px";
        d.style.width = p.s + "px";
        d.style.height = p.s + "px";
        fxEl.appendChild(d);
        setTimeout(function () { d.remove(); }, 350);
      }

      function floatScore(r, c, n) {
        const p = slotRect(r, c);
        const d = document.createElement("div");
        d.className = "floater";
        d.textContent = "+" + n;
        d.style.left = (p.x + 6) + "px";
        d.style.top = p.y + "px";
        fxEl.appendChild(d);
        setTimeout(function () { d.remove(); }, 700);
      }

      const COLORS = ["#fb7185", "#6ea8ff", "#3dd68c", "#fde047", "#c084fc"];

      function burstCell(r, c, pts) {
        const x = grid[r][c];
        if (!x) return;
        const el = pieces[x.id];
        if (el) {
          el.classList.add("burst");
          setTimeout(function () { if (el.parentNode) el.remove(); delete pieces[x.id]; }, 220);
        }
        sparks(r, c, COLORS[Math.max(0, x.t)] || "#ffb020", 8);
        if (x.s === 1) beam(1, r, c);
        if (x.s === 2) beam(2, r, c);
        if (x.s === 3) ringAt(r, c);
        if (pts) floatScore(r, c, pts);
      }

      function swapCells(r1, c1, r2, c2) {
        const t = grid[r1][c1];
        grid[r1][c1] = grid[r2][c2];
        grid[r2][c2] = t;
      }

      async function slideSwap(r1, c1, r2, c2) {
        const a = grid[r1][c1], b = grid[r2][c2];
        if (a && pieces[a.id]) place(pieces[a.id], r1, c1, true);
        if (b && pieces[b.id]) place(pieces[b.id], r2, c2, true);
        await wait(180);
      }

      function runsAt(g) {
        const h = [], v = [];
        for (let r = 0; r < N; r++) {
          let n = 1;
          for (let c = 1; c <= N; c++) {
            const same = c < N && g[r][c] && g[r][c - 1] && g[r][c].t >= 0 && g[r][c].t === g[r][c - 1].t;
            if (same) n++;
            else { if (n >= 3) h.push({ r: r, c0: c - n, c1: c - 1, n: n }); n = 1; }
          }
        }
        for (let c = 0; c < N; c++) {
          let n = 1;
          for (let r = 1; r <= N; r++) {
            const same = r < N && g[r][c] && g[r - 1][c] && g[r][c].t >= 0 && g[r][c].t === g[r - 1][c].t;
            if (same) n++;
            else { if (n >= 3) v.push({ c: c, r0: r - n, r1: r - 1, n: n }); n = 1; }
          }
        }
        return { h: h, v: v };
      }

      function matchSet(g) {
        const set = {};
        const rv = runsAt(g);
        rv.h.forEach(function (run) {
          for (let c = run.c0; c <= run.c1; c++) set[idx(run.r, c)] = true;
        });
        rv.v.forEach(function (run) {
          for (let r = run.r0; r <= run.r1; r++) set[idx(r, run.c)] = true;
        });
        return { set: set, runs: rv };
      }

      function hasMatch(g) { return Object.keys(matchSet(g).set).length > 0; }

      function wouldMatch(r1, c1, r2, c2) {
        const a = grid[r1][c1], b = grid[r2][c2];
        if (!a || !b) return false;
        if (a.s === 4 || b.s === 4 || (a.s && b.s)) return true;
        swapCells(r1, c1, r2, c2);
        const ok = hasMatch(grid);
        swapCells(r1, c1, r2, c2);
        return ok;
      }

      function hasMove() {
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          if (c + 1 < N && wouldMatch(r, c, r, c + 1)) return true;
          if (r + 1 < N && wouldMatch(r, c, r + 1, c)) return true;
        }
        return false;
      }

      function shuffle() {
        const pool = [];
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) pool.push(grid[r][c]);
        for (let k = 0; k < 40; k++) {
          for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
          }
          let n = 0;
          for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) grid[r][c] = pool[n++];
          if (!hasMatch(grid) && hasMove()) return;
        }
      }

      function fillFresh() {
        grid = [];
        for (let r = 0; r < N; r++) {
          grid[r] = [];
          for (let c = 0; c < N; c++) {
            let x, guard = 0;
            do {
              x = candy();
              guard++;
              const left2 = c >= 2 && grid[r][c - 1].t === x.t && grid[r][c - 2].t === x.t;
              const up2 = r >= 2 && grid[r - 1][c].t === x.t && grid[r - 2][c].t === x.t;
              if (!left2 && !up2) break;
            } while (guard < 12);
            grid[r][c] = x;
          }
        }
        if (hasMatch(grid) || !hasMove()) shuffle();
      }

      function addClear(out, r, c) {
        if (!inside(r, c) || !grid[r][c]) return;
        out[idx(r, c)] = true;
      }

      function explodeFrom(out, fired, r, c) {
        const key = idx(r, c);
        if (fired[key] || !grid[r][c]) return;
        fired[key] = true;
        const s = grid[r][c].s;
        addClear(out, r, c);
        if (s === 1) { for (let i = 0; i < N; i++) addClear(out, r, i); }
        if (s === 2) { for (let i = 0; i < N; i++) addClear(out, i, c); }
        if (s === 3) {
          for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) addClear(out, r + dr, c + dc);
        }
        if (s === 4) {
          const counts = {};
          for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) {
            if (grid[rr][cc] && grid[rr][cc].t >= 0) counts[grid[rr][cc].t] = true;
          }
          const list = Object.keys(counts);
          if (list.length) {
            const color = +list[Math.floor(Math.random() * list.length)];
            for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) {
              if (grid[rr][cc] && grid[rr][cc].t === color) addClear(out, rr, cc);
            }
          }
        }
      }

      function resolveSpecialSwap(r1, c1, r2, c2, out, fired) {
        const a = grid[r1][c1], b = grid[r2][c2];
        if (a.s === 4 && b.s === 4) {
          for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) addClear(out, r, c);
          return true;
        }
        if (a.s === 4 || b.s === 4) {
          const color = a.s === 4 ? b.t : a.t;
          const other = a.s === 4 ? { r: r2, c: c2 } : { r: r1, c: c1 };
          addClear(out, r1, c1); addClear(out, r2, c2);
          for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
            if (grid[r][c] && grid[r][c].t === color) addClear(out, r, c);
          }
          if (grid[other.r][other.c] && grid[other.r][other.c].s) explodeFrom(out, fired, other.r, other.c);
          return true;
        }
        if (a.s && b.s) {
          explodeFrom(out, fired, r1, c1);
          explodeFrom(out, fired, r2, c2);
          return true;
        }
        return false;
      }

      function gravity() {
        for (let c = 0; c < N; c++) {
          let w = N - 1;
          for (let r = N - 1; r >= 0; r--) {
            if (grid[r][c]) { grid[w][c] = grid[r][c]; if (w !== r) grid[r][c] = null; w--; }
          }
          while (w >= 0) { grid[w][c] = candy(); w--; }
        }
      }

      async function cascade(swap) {
        combo = 0;
        let first = true;
        for (let step = 0; step < 20; step++) {
          const out = {}, fired = {};
          if (first && swap) resolveSpecialSwap(swap.r1, swap.c1, swap.r2, swap.c2, out, fired);
          first = false;
          const found = matchSet(grid);
          const keys = Object.keys(found.set);
          if (!keys.length && !Object.keys(out).length) break;
          keys.forEach(function (k) { out[k] = true; });
          let chained = true;
          while (chained) {
            chained = false;
            Object.keys(out).forEach(function (k) {
              const r = Math.floor(+k / N), c = +k % N;
              if (grid[r][c] && grid[r][c].s && !fired[+k]) {
                explodeFrom(out, fired, r, c);
                chained = true;
              }
            });
          }
          let spawn = null;
          const both = {};
          found.runs.h.forEach(function (run) {
            for (let c = run.c0; c <= run.c1; c++) both[idx(run.r, c)] = (both[idx(run.r, c)] || 0) | 1;
          });
          found.runs.v.forEach(function (run) {
            for (let r = run.r0; r <= run.r1; r++) both[idx(r, run.c)] = (both[idx(r, run.c)] || 0) | 2;
          });
          Object.keys(both).forEach(function (k) { if (both[k] === 3) spawn = { i: +k, s: 3 }; });
          found.runs.h.concat(found.runs.v).forEach(function (run) {
            if (run.n >= 5) {
              const i = idx(run.r !== undefined ? run.r : run.r0 + 2, run.c !== undefined ? run.c : run.c0 + 2);
              spawn = { i: i, s: 4 };
            } else if (run.n === 4 && (!spawn || spawn.s < 3)) {
              const s = run.r !== undefined ? 1 : 2;
              const mid = idx(run.r !== undefined ? run.r : Math.floor((run.r0 + run.r1) / 2), run.c !== undefined ? run.c : Math.floor((run.c0 + run.c1) / 2));
              spawn = { i: mid, s: s };
            }
          });
          if (spawn && swap) {
            const mi = idx(swap.moved.r, swap.moved.c);
            if (out[mi]) spawn.i = mi;
          }
          combo++;
          const pts = 60 * combo;
          score += Object.keys(out).length * pts + (spawn ? 200 : 0);
          beep(380 + combo * 70, 0.08, "triangle", 0.08, 520 + combo * 80);
          const keep = spawn && out[spawn.i] ? spawn.i : -1;
          Object.keys(out).forEach(function (k) {
            if (+k === keep) return;
            const r = Math.floor(+k / N), c = +k % N;
            burstCell(r, c, pts);
          });
          await wait(220);
          Object.keys(out).forEach(function (k) {
            if (+k === keep) return;
            const r = Math.floor(+k / N), c = +k % N;
            grid[r][c] = null;
          });
          if (keep >= 0) {
            const r = Math.floor(keep / N), c = keep % N;
            const color = (swap && swap.color >= 0) ? swap.color : grid[r][c].t;
            const id = grid[r][c].id;
            grid[r][c] = { t: spawn.s === 4 ? -1 : color, s: spawn.s, id: id };
            const el = pieces[id];
            if (el) { stylePiece(el, grid[r][c]); el.classList.remove("burst"); el.classList.add("morph"); }
          }
          gravity();
          syncPieces(true);
          hud();
          await wait(210);
          if (score >= goal) return "win";
        }
        if (!hasMove()) { shuffle(); syncPieces(true); beep(240, 0.12, "sine", 0.08); }
        return "ok";
      }

      function pick(r, c) {
        unlock();
        if (selected && !(selected.r === r && selected.c === c)) {
          trySwap(selected.r, selected.c, r, c);
          return;
        }
        selected = { r: r, c: c };
        cells.forEach(function (el, i) {
          el.classList.toggle("on", Math.floor(i / N) === r && (i % N) === c);
        });
      }

      async function trySwap(r1, c1, r2, c2) {
        if (busy) return;
        if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) { selected = { r: r2, c: c2 }; pick(r2, c2); return; }
        busy = true;
        dragFrom = null;
        selected = null;
        cells.forEach(function (el) { el.classList.remove("on"); });
        const valid = wouldMatch(r1, c1, r2, c2);
        const color = grid[r1][c1] && grid[r1][c1].t >= 0 ? grid[r1][c1].t : (grid[r2][c2] && grid[r2][c2].t);
        swapCells(r1, c1, r2, c2);
        await slideSwap(r1, c1, r2, c2);
        if (!valid) {
          beep(160, 0.08, "square", 0.05);
          swapCells(r1, c1, r2, c2);
          await slideSwap(r1, c1, r2, c2);
          busy = false;
          return;
        }
        beep(420, 0.06, "sine", 0.07);
        moves--;
        hud();
        const result = await cascade({ r1: r1, c1: c1, r2: r2, c2: c2, moved: { r: r2, c: c2 }, color: color });
        persist();
        busy = false;
        if (result === "win") return end(true);
        if (moves <= 0 && score < goal) return end(false);
      }

      function persist() {
        try {
          localStorage.setItem("candy-save", JSON.stringify({
            level: level,
            score: score,
            moves: moves,
            over: overEl.classList.contains("show") ? document.getElementById("overTitle").textContent : "",
            grid: grid ? grid.map(function (row) {
              return row.map(function (x) { return x ? { t: x.t, s: x.s } : null; });
            }) : null
          }));
          if (level > best) {
            best = level;
            localStorage.setItem("candy-best", String(best));
          }
        } catch (err) {}
        hud();
      }

      function end(win) {
        busy = true;
        document.getElementById("overTitle").textContent = win ? "Level " + level + " clear" : "Out of moves";
        document.getElementById("overHint").textContent = win ? "Tap for the next level" : "Tap to retry";
        overEl.classList.add("show");
        if (win) {
          beep(523, 0.12, "sine", 0.1); beep(659, 0.16, "triangle", 0.1); beep(784, 0.28, "sine", 0.12);
          if (level + 1 > best) { best = level + 1; localStorage.setItem("candy-best", String(best)); }
        } else beep(140, 0.25, "triangle", 0.1, 70);
        persist();
      }

      function startLevel(resetAll) {
        if (resetAll) {
          level = 1;
          try { localStorage.removeItem("candy-save"); } catch (err) {}
        }
        score = 0;
        goal = Math.round(900 + level * 550);
        moves = Math.max(16, 26 - Math.floor(level / 2));
        busy = false;
        selected = null;
        dragFrom = null;
        overEl.classList.remove("show");
        fxEl.textContent = "";
        clearPieces();
        fillFresh();
        syncPieces(false);
        persist();
      }

      function restore() {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem("candy-save") || "null"); } catch (err) { saved = null; }
        if (!saved || !saved.grid || saved.grid.length !== N) return false;
        level = saved.level || 1;
        score = saved.score || 0;
        goal = Math.round(900 + level * 550);
        moves = saved.moves;
        nextId = 1;
        grid = saved.grid.map(function (row) {
          return row.map(function (x) { return x ? { t: x.t, s: x.s, id: nextId++ } : null; });
        });
        busy = false;
        selected = null;
        dragFrom = null;
        fxEl.textContent = "";
        clearPieces();
        syncPieces(false);
        if (saved.over) {
          document.getElementById("overTitle").textContent = saved.over;
          document.getElementById("overHint").textContent = saved.over.indexOf("clear") >= 0 ? "Tap for the next level" : "Tap to retry";
          overEl.classList.add("show");
          busy = true;
        }
        hud();
        return true;
      }

      overEl.addEventListener("click", function () {
        if (!overEl.classList.contains("show")) return;
        const win = document.getElementById("overTitle").textContent.indexOf("clear") >= 0;
        if (win) level++;
        startLevel(false);
      });
      document.getElementById("restart").onclick = function () { startLevel(true); };
      window.addEventListener("keydown", function (e) {
        if (!overEl.classList.contains("show")) return;
        e.preventDefault();
        overEl.click();
      });
      muteBtn.onclick = function () {
        unlock();
        muted = !muted;
        localStorage.setItem("candy-mute", muted ? "1" : "0");
        setMuteIcon(muteBtn, muted);
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.16, audioCtx.currentTime, 0.02);
      };
      window.addEventListener("resize", function () { if (grid) syncPieces(false); });
      if (!restore()) startLevel(true);
    })();
  </script>
</body>
</html>
