<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minesweeper</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23171a21'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%236ea8ff'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a3140; --text:#e8edf5; --muted:#8b95a8; --accent:#6ea8ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body {
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
    .bar a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--accent); }
    .bar button {
      appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .wrap { width: min(480px, calc(100% - 24px)); margin: 0 auto 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .hud { display: flex; gap: 8px; margin-bottom: 12px; }
    .stat { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
    .stat b { display: block; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .board {
      display: grid; gap: 3px; background: var(--line); border: 1px solid var(--line);
      border-radius: 12px; padding: 8px; user-select: none; transition: transform 80ms;
      touch-action: none; -webkit-touch-callout: none;
    }
    .board.shake { transform: translate(3px, -2px); }
    .board.win { box-shadow: 0 0 0 1px #3dd68c inset; }
    .cell {
      aspect-ratio: 1; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2, var(--panel)); color: var(--text);
      font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer;
      transform: scale(1); transition: transform 90ms ease, background 90ms ease;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    .cell.open { background: var(--bg); cursor: default; border-color: transparent; }
    .cell.mine { background: #3a1d22; color: #fb7185; animation: boom .28s ease; }
    .cell.flag { background: var(--panel); color: #ffb020; border-color: var(--accent); }
    .cell.pop { transform: scale(1.12); }
    @keyframes boom { 0% { transform: scale(.6); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .n1 { color: #6ea8ff; } .n2 { color: #3dd68c; } .n3 { color: #fb7185; }
    .n4 { color: #c084fc; } .n5 { color: #ffb020; } .n6 { color: #67e8f9; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button {
      flex: 1; appearance: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px; cursor: pointer; font: inherit; font-size: 13px;
    }
    .status { text-align: center; color: var(--muted); margin: 10px 0 0; min-height: 1.4em; }
  </style>
  <link rel="stylesheet" href="../../shared/site.css" />
  <script src="../../shared/site.js"></script>
</head>
<body>
  <div class="bar">
    <a href="../../">← Home</a>
    <button type="button" id="mute">Sound on</button>
  </div>
  <div class="wrap">
    <h1>Minesweeper</h1>
    <p class="sub">First click is always safe. Tap to open, hold to flag.</p>
    <div class="hud">
      <div class="stat"><span>Mines</span><b id="left">10</b></div>
      <div class="stat"><span>Time</span><b id="time">0</b></div>
    </div>
    <div class="board" id="board"></div>
    <p class="status" id="status"></p>
    <div class="actions">
      <button type="button" data-diff="9,9,10">9×9</button>
      <button type="button" data-diff="16,16,40">16×16</button>
      <button type="button" id="restart">New game</button>
    </div>
  </div>
  <script>
    (function () {
      let W = 9, H = 9, MINES = 10;
      let mines, open, flag, nums, started, dead, won, t0, tick, cells = [], canRestart = false;
      let muted, audioCtx, master;
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const muteBtn = document.getElementById("mute");
      muted = localStorage.getItem("mines-mute") === "1";
      setMuteIcon(muteBtn, muted);

      function unlock() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          master = audioCtx.createGain();
          master.connect(audioCtx.destination);
          master.gain.value = muted ? 0 : 0.18;
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
      function beep(freq, dur, type, vol, slide) {
        if (!audioCtx || muted) return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || "square";
        o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
        g.gain.setValueAtTime(vol || 0.1, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.02);
      }

      function idx(r, c) { return r * W + c; }
      function neigh(r, c) {
        const out = [];
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const rr = r + dr, cc = c + dc;
          if (rr >= 0 && cc >= 0 && rr < H && cc < W) out.push([rr, cc]);
        }
        return out;
      }

      function placeMines(safeR, safeC) {
        mines = Array(H * W).fill(false);
        const banned = {};
        banned[idx(safeR, safeC)] = true;
        neigh(safeR, safeC).forEach(function (p) { banned[idx(p[0], p[1])] = true; });
        let spots = [];
        for (let i = 0; i < H * W; i++) if (!banned[i]) spots.push(i);
        for (let i = spots.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = spots[i]; spots[i] = spots[j]; spots[j] = t;
        }
        const n = Math.min(MINES, spots.length);
        for (let i = 0; i < n; i++) mines[spots[i]] = true;
        nums = Array(H * W).fill(0);
        for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
          if (mines[idx(r, c)]) continue;
          nums[idx(r, c)] = neigh(r, c).filter(function (p) { return mines[idx(p[0], p[1])]; }).length;
        }
      }

      function paintOne(i, pop) {
        const el = cells[i];
        el.className = "cell";
        el.textContent = "";
        if (flag[i] && !open[i]) { el.classList.add("flag"); el.textContent = "▲"; return; }
        if (!open[i]) return;
        el.classList.add("open");
        if (pop) {
          el.classList.add("pop");
          setTimeout(function () { el.classList.remove("pop"); }, 120);
        }
        if (mines[i]) { el.classList.add("mine"); el.textContent = "●"; return; }
        if (nums[i]) { el.textContent = String(nums[i]); el.classList.add("n" + nums[i]); }
      }
      function hud() {
        document.getElementById("left").textContent = String(Math.max(0, MINES - flag.filter(Boolean).length));
      }

      function flood(r, c) {
        const queue = [[r, c, 0]];
        const seen = {};
        const order = [];
        while (queue.length) {
          const p = queue.shift();
          const i = idx(p[0], p[1]);
          if (seen[i] || flag[i]) continue;
          seen[i] = true;
          order.push({ i: i, d: p[2] });
          if (nums[i] === 0 && !mines[i]) {
            neigh(p[0], p[1]).forEach(function (n) { queue.push([n[0], n[1], p[2] + 1]); });
          }
        }
        order.forEach(function (o) {
          setTimeout(function () {
            if (dead) return;
            open[o.i] = true;
            paintOne(o.i, true);
            if (o.d % 3 === 0) beep(420 + o.d * 8, 0.04, "sine", 0.04);
            checkWin();
          }, Math.min(o.d * 18, 420));
        });
      }

      function checkWin() {
        if (dead || won) return;
        let hidden = 0;
        for (let i = 0; i < H * W; i++) if (!open[i]) hidden++;
        if (hidden === MINES) {
          won = true;
          statusEl.textContent = "Cleared";
          stopTimer();
          boardEl.classList.add("win");
          beep(523, 0.12, "sine", 0.1); beep(659, 0.16, "triangle", 0.1); beep(784, 0.28, "sine", 0.12);
          for (let i = 0; i < mines.length; i++) if (mines[i]) { flag[i] = true; paintOne(i); }
          hud();
        }
      }

      function boom(hit) {
        dead = true;
        canRestart = false;
        stopTimer();
        statusEl.textContent = "Boom";
        boardEl.classList.add("shake");
        beep(90, 0.35, "sawtooth", 0.14, 40);
        beep(180, 0.2, "square", 0.08);
        const idxs = [];
        for (let i = 0; i < mines.length; i++) if (mines[i]) idxs.push(i);
        idxs.forEach(function (i, n) {
          setTimeout(function () { open[i] = true; paintOne(i, true); }, 40 + n * 45);
        });
        const wait = 40 + Math.max(0, idxs.length - 1) * 45 + 220;
        setTimeout(function () {
          boardEl.classList.remove("shake");
          canRestart = true;
          statusEl.textContent = "Boom · click the board";
        }, wait);
      }

      function click(r, c, which) {
        if (dead && canRestart && which !== 2) { reset(); return; }
        if (dead || won) return;
        unlock();
        const i = idx(r, c);
        if (!started) {
          placeMines(r, c);
          started = true;
          t0 = Date.now();
          tick = setInterval(function () {
            document.getElementById("time").textContent = String(Math.floor((Date.now() - t0) / 1000));
          }, 250);
        }
        if (which === 2) {
          if (open[i]) return;
          flag[i] = !flag[i];
          paintOne(i);
          hud();
          beep(flag[i] ? 300 : 180, 0.06, "triangle", 0.07);
          return;
        }
        if (flag[i]) return;
        if (mines[i]) { open[i] = true; paintOne(i, true); boom(i); return; }
        flood(r, c);
        hud();
      }

      function stopTimer() { if (tick) clearInterval(tick); tick = null; }

      function reset(w, h, m) {
        if (w) { W = w; H = h; MINES = m; }
        stopTimer();
        mines = []; open = Array(H * W).fill(false); flag = Array(H * W).fill(false);
        nums = Array(H * W).fill(0); started = false; dead = false; won = false; canRestart = false;
        document.getElementById("time").textContent = "0";
        document.getElementById("left").textContent = String(MINES);
        statusEl.textContent = "";
        boardEl.classList.remove("shake", "win");
        boardEl.style.gridTemplateColumns = "repeat(" + W + ", 1fr)";
        boardEl.textContent = "";
        cells = [];
        for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
          const b = document.createElement("button");
          b.className = "cell";
          b.type = "button";
          let holdTimer = null, held = false;
          b.addEventListener("pointerdown", function (e) {
            if (e.pointerType === "mouse" && e.button !== 0) return;
            e.preventDefault();
            held = false;
            holdTimer = setTimeout(function () {
              held = true;
              click(r, c, 2);
            }, 420);
          });
          function cancelHold() { clearTimeout(holdTimer); holdTimer = null; }
          b.addEventListener("pointerup", function (e) {
            const wasHeld = held;
            cancelHold();
            if (wasHeld) { held = false; return; }
            if (e.pointerType === "mouse" && e.button !== 0) return;
            click(r, c, 1);
          });
          b.addEventListener("pointercancel", function () { cancelHold(); held = false; });
          b.addEventListener("contextmenu", function (e) { e.preventDefault(); click(r, c, 2); });
          boardEl.appendChild(b);
          cells.push(b);
        }
      }

      muteBtn.onclick = function () {
        unlock();
        muted = !muted;
        localStorage.setItem("mines-mute", muted ? "1" : "0");
        setMuteIcon(muteBtn, muted);
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.18, audioCtx.currentTime, 0.02);
      };
      document.getElementById("restart").onclick = function () { reset(); };
      document.querySelectorAll("[data-diff]").forEach(function (btn) {
        btn.onclick = function () {
          const p = btn.getAttribute("data-diff").split(",").map(Number);
          reset(p[0], p[1], p[2]);
        };
      });
      reset();
    })();
  </script>
</body>
</html>
