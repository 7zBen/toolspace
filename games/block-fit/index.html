<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="description" content="Drop pieces on the grid. Full rows and columns clear.">
  <title>Block Fit · toolspace</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="../../assets/game.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../assets/site.js"></script>
  <script src="../../assets/game.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body data-layout="app" data-page="block-fit" data-title="Block Fit" data-back="games/" data-sound>
  <main class="game">
    <div class="hud">
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span>Best</span><b id="best">0</b></div>
    </div>
    <div class="board-wrap game-board" id="wrap">
      <div class="board" id="board"></div>
      <div class="fx" id="fx"></div>
      <div class="overlay" id="overlay"><div><strong>No room left</strong><span id="overlay-text">Tap to play again</span></div></div>
    </div>
    <div class="tray game-board" id="tray"></div>
    <div class="game-actions"><button class="button button-secondary" type="button" id="restart">New game</button></div>
    <p class="game-hint">Drag a piece onto the board, or tap a piece then tap a square.</p>
  </main>
</body>
</html>
