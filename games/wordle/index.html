<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="description" content="Guess the five-letter word in six tries.">
  <title>Wordle · toolspace</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="../../assets/game.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../assets/site.js"></script>
  <script src="../../assets/game.js" defer></script>
  <script src="words.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body data-layout="app" data-page="wordle" data-title="Wordle" data-back="games/" data-sound>
  <main class="game">
    <div class="hud">
      <div class="stat"><span>Played</span><b id="played">0</b></div>
      <div class="stat"><span>Won</span><b id="won">0</b></div>
      <div class="stat"><span>Streak</span><b id="streak">0</b></div>
    </div>
    <p class="message" id="message" aria-live="polite"></p>
    <div class="grid game-board" id="grid"></div>
    <div class="keyboard game-board" id="keyboard"></div>
    <div class="game-actions"><button class="button button-secondary" type="button" id="restart">New word</button></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </main>
</body>
</html>
