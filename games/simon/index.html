<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="description" content="Watch the pattern, then repeat it.">
  <title>Simon Says · toolspace</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="../../assets/game.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../assets/site.js"></script>
  <script src="../../assets/game.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body data-layout="app" data-page="simon" data-title="Simon Says" data-back="games/" data-sound>
  <main class="game">
    <div class="hud">
      <div class="stat"><span>Round</span><b id="round">0</b></div>
      <div class="stat"><span>Best</span><b id="best">0</b></div>
    </div>
    <div class="pad game-board locked" id="pad">
      <button class="pad-btn red" type="button" data-i="0" aria-label="Red"></button>
      <button class="pad-btn blue" type="button" data-i="1" aria-label="Blue"></button>
      <button class="pad-btn yellow" type="button" data-i="2" aria-label="Yellow"></button>
      <button class="pad-btn green" type="button" data-i="3" aria-label="Green"></button>
      <button class="pad-center" type="button" id="start">Start</button>
    </div>
    <p class="status" id="status" aria-live="polite">Press start</p>
    <p class="game-hint keys-only">Keys 1–4 work too. Space to start.</p>
  </main>
</body>
</html>
