<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f1a2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Full-screen clock. Digital or analog, five faces.">
  <title>Clock · toolspace</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="clock.css">
  <script src="../../assets/site.js"></script>
  <script src="clock.js" defer></script>
</head>
<body data-layout="bare" data-page="clock">
  <main class="stage" id="stage" data-face="midnight">
    <div class="controls" id="controls">
      <a class="ctrl" href="../../" aria-label="Home" title="Home"><span data-icon="back"></span></a>
      <span class="controls-gap"></span>
      <button class="ctrl" type="button" id="fs-button" aria-label="Fullscreen" title="Fullscreen (F)"><span data-icon="expand"></span></button>
      <button class="ctrl" type="button" id="cog" aria-label="Clock settings" title="Settings (S)" aria-controls="settings" aria-expanded="false"><span data-icon="cog"></span></button>
    </div>

    <div class="face">
      <div class="digital" aria-hidden="true">
        <span class="hm" id="hm">--:--</span>
        <span class="side"><span class="secs" id="secs">--</span><span class="ampm" id="ampm"></span></span>
      </div>
      <svg class="analog" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="dial" cx="100" cy="100" r="96"/>
        <g id="ticks"></g>
        <line class="hand hour" id="hand-h" x1="100" y1="100" x2="100" y2="54"/>
        <line class="hand min" id="hand-m" x1="100" y1="100" x2="100" y2="28"/>
        <line class="hand sec" id="hand-s" x1="100" y1="116" x2="100" y2="20"/>
        <circle class="cap" cx="100" cy="100" r="4.5"/>
      </svg>
      <p class="date" id="date"></p>
    </div>
    <span class="sr-only" id="sr-time"></span>
    <p class="fs-hint" id="fs-hint">Click anywhere for fullscreen</p>
  </main>

  <div class="settings-scrim" id="scrim"></div>
  <aside class="settings" id="settings" aria-label="Clock settings" hidden>
    <div class="settings-head">
      <h2>Settings</h2>
      <button class="icon-button" type="button" id="close-settings" aria-label="Close settings"><span data-icon="close"></span></button>
    </div>

    <div class="field">
      <span class="field-label">Style</span>
      <div class="segmented" role="group" aria-label="Clock style">
        <button type="button" data-mode="digital" aria-pressed="true">Digital</button>
        <button type="button" data-mode="analog" aria-pressed="false">Analog</button>
      </div>
    </div>

    <div class="setting-row"><strong>12-hour time</strong><label class="switch"><input id="opt-12h" type="checkbox" aria-label="12-hour time"><span></span></label></div>
    <div class="setting-row"><strong>Seconds</strong><label class="switch"><input id="opt-secs" type="checkbox" aria-label="Show seconds"><span></span></label></div>
    <div class="setting-row"><strong>Date</strong><label class="switch"><input id="opt-date" type="checkbox" aria-label="Show date"><span></span></label></div>

    <hr class="divider">

    <div class="field">
      <span class="field-label">Face <span class="face-name" id="face-name"></span></span>
      <div class="swatches" id="faces" role="group" aria-label="Clock face"></div>
    </div>
    <div class="field">
      <label for="opt-zone">Time zone</label>
      <select class="select" id="opt-zone"></select>
    </div>

    <hr class="divider">
    <ul class="keys">
      <li><kbd>F</kbd> Fullscreen</li>
      <li><kbd>A</kbd> Analog / digital</li>
      <li><kbd>C</kbd> Next face</li>
      <li><kbd>S</kbd> Settings</li>
    </ul>
  </aside>
</body>
</html>
