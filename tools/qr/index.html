<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="description" content="QR codes for links, text or Wi-Fi. PNG or SVG.">
  <title>QR Maker · toolspace</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="qr.css">
  <script src="../../assets/site.js"></script>
  <script src="../../assets/qrcode.min.js" defer></script>
  <script src="qr.js" defer></script>
</head>
<body data-layout="app" data-page="qr" data-title="QR Maker" data-back="">
  <main class="app-main">
    <div class="tool-layout equal">
      <div class="stack">
        <div class="surface">
          <div class="segmented mode-tabs" role="tablist" aria-label="What the code holds">
            <button type="button" role="tab" data-mode="link" aria-pressed="true"><span data-icon="link" data-icon-class="icon-sm"></span> Link</button>
            <button type="button" role="tab" data-mode="text" aria-pressed="false"><span data-icon="text" data-icon-class="icon-sm"></span> Text</button>
            <button type="button" role="tab" data-mode="wifi" aria-pressed="false"><span data-icon="wifi" data-icon-class="icon-sm"></span> Wi-Fi</button>
          </div>

          <div data-panel="link">
            <div class="field">
              <label for="in-link">Website address</label>
              <input class="input" id="in-link" type="text" inputmode="url" placeholder="example.com/page" autocomplete="url" spellcheck="false">
            </div>
          </div>

          <div data-panel="text" hidden>
            <div class="field">
              <label for="in-text">Text</label>
              <textarea class="textarea" id="in-text" rows="5" placeholder="Anything: a note, a phone number, a code…"></textarea>
              <span class="counter" id="text-count">0 characters</span>
            </div>
          </div>

          <div data-panel="wifi" hidden>
            <div class="field">
              <label for="in-ssid">Network name</label>
              <input class="input" id="in-ssid" type="text" placeholder="My Home Wi-Fi" autocomplete="off" spellcheck="false">
            </div>
            <div class="two-col">
              <div class="field">
                <label for="in-sec">Security</label>
                <select class="select" id="in-sec">
                  <option value="WPA">WPA / WPA2 / WPA3</option>
                  <option value="WEP">WEP (old)</option>
                  <option value="nopass">None (open)</option>
                </select>
              </div>
              <div class="field" id="pass-field">
                <label for="in-pass">Password</label>
                <div class="password-row">
                  <input class="input" id="in-pass" type="password" autocomplete="off" spellcheck="false">
                  <button class="icon-button" type="button" id="pass-toggle" aria-label="Show password" title="Show password"><span data-icon="eye" data-icon-class="icon-sm"></span></button>
                </div>
              </div>
            </div>
            <label class="check"><input type="checkbox" id="in-hidden"> Hidden network</label>
            <p class="field-hint wifi-note">The Wi-Fi password is never saved.</p>
          </div>
        </div>

        <div class="surface">
          <div class="surface-title"><h2>Look</h2></div>
          <div class="field">
            <span class="field-label">Dot style</span>
            <div class="segmented" role="group" aria-label="Dot style">
              <button type="button" data-style="square" aria-pressed="true">Square</button>
              <button type="button" data-style="rounded" aria-pressed="false">Rounded</button>
              <button type="button" data-style="dots" aria-pressed="false">Dots</button>
            </div>
          </div>
          <div class="two-col">
            <div class="field">
              <label for="in-fg">Dots</label>
              <div class="color-control"><input id="in-fg" type="color" value="#172334"><span class="mono" id="fg-label">#172334</span></div>
            </div>
            <div class="field">
              <label for="in-bg">Background</label>
              <div class="color-control"><input id="in-bg" type="color" value="#ffffff"><span class="mono" id="bg-label">#ffffff</span></div>
            </div>
          </div>
          <div class="setting-row">
            <strong>Transparent background</strong>
            <label class="switch"><input id="in-transparent" type="checkbox" aria-label="Transparent background"><span></span></label>
          </div>
          <div class="setting-row">
            <strong>Quiet border</strong>
            <label class="switch"><input id="in-margin" type="checkbox" checked aria-label="Quiet border"><span></span></label>
          </div>
          <hr class="divider">
          <div class="field">
            <label for="in-ecc">Error correction</label>
            <select class="select" id="in-ecc">
              <option value="L">Low: smallest code</option>
              <option value="M">Medium: recommended</option>
              <option value="Q">High: survives scuffs</option>
              <option value="H">Highest: survives a logo on top</option>
            </select>
          </div>
        </div>
      </div>

      <div class="surface preview-surface">
        <div class="surface-title"><h2>Preview</h2></div>
        <div class="qr-frame">
          <div class="qr-paper" id="paper">
            <canvas id="canvas" width="1024" height="1024" role="img" aria-label="QR code preview"></canvas>
            <div class="qr-placeholder" id="placeholder">Type something to make a code</div>
          </div>
        </div>
        <p class="qr-caption" id="caption"></p>
        <div class="warn" id="warn" hidden></div>
        <div class="export-row">
          <select class="select" id="in-size" aria-label="PNG size">
            <option value="512">PNG · 512 px</option>
            <option value="1024">PNG · 1024 px</option>
            <option value="2048">PNG · 2048 px</option>
            <option value="4096">PNG · 4096 px (print)</option>
          </select>
          <button class="button button-primary" id="dl-png" type="button" disabled><span data-icon="download" data-icon-class="icon-sm"></span> PNG</button>
        </div>
        <div class="button-row export-more">
          <button class="button button-secondary" id="dl-svg" type="button" disabled><span data-icon="download" data-icon-class="icon-sm"></span> SVG</button>
          <button class="button button-soft" id="copy-img" type="button" disabled><span data-icon="copy" data-icon-class="icon-sm"></span> Copy image</button>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
