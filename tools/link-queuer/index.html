<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="description" content="Paste a list of links and open them one by one.">
  <title>Link Queuer · toolspace</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="queue.css">
  <script src="../../assets/site.js"></script>
  <script src="queue.js" defer></script>
</head>
<body data-layout="app" data-page="link-queuer" data-title="Link Queuer" data-back="">
  <main class="app-main">
    <div class="tool-layout">
      <section class="surface" aria-labelledby="queue-title">
        <div class="queue-head">
          <h2 id="queue-title">Queue</h2>
          <div class="queue-stats">
            <span class="pill" id="left-pill">0 left</span>
            <span class="pill neutral" id="opened-pill">0 opened</span>
          </div>
        </div>

        <div class="empty-state" id="empty">
          <div>
            <span class="tint mint"><span data-icon="link" data-icon-class="icon-lg"></span></span>
            <strong>Nothing queued</strong>
            <p>Paste some links to start. Messy text is fine, the links are picked out.</p>
          </div>
        </div>

        <div id="queue" hidden>
          <div class="up-next" id="up-next"></div>
          <div id="rest">
            <div class="list-tools">
              <h3 id="rest-label">Then</h3>
              <label class="filter">
                <span data-icon="search" data-icon-class="icon-sm"></span>
                <span class="sr-only">Filter links</span>
                <input class="input" id="filter" type="search" placeholder="Filter" autocomplete="off" spellcheck="false">
              </label>
            </div>
            <ol class="queue-list" id="list"></ol>
          </div>
        </div>

        <div class="queue-footer">
          <div class="button-row">
            <button class="button button-secondary button-sm" id="undo" type="button" disabled><span data-icon="undo" data-icon-class="icon-sm"></span> Undo</button>
            <button class="button button-ghost button-sm" id="copy-all" type="button" disabled><span data-icon="copy" data-icon-class="icon-sm"></span> Copy all</button>
            <button class="button button-ghost button-sm" id="export" type="button" disabled><span data-icon="download" data-icon-class="icon-sm"></span> Export .txt</button>
          </div>
          <button class="button button-danger button-sm" id="clear" type="button" disabled><span data-icon="trash" data-icon-class="icon-sm"></span> Clear all</button>
        </div>
      </section>

      <div class="stack">
        <section class="surface" aria-labelledby="add-title">
          <div class="surface-title"><h2 id="add-title">Add links</h2></div>
          <div class="drop" id="drop">
            <label class="sr-only" for="paste">Links to add</label>
            <textarea class="textarea" id="paste" placeholder="One per line, or paste any text with links in it.&#10;example.com works too.&#10;You can also drop a .txt file here." spellcheck="false" autocomplete="off"></textarea>
          </div>
          <div class="button-row add-row">
            <button class="button button-primary" id="add" type="button"><span data-icon="plus" data-icon-class="icon-sm"></span> Add</button>
            <label class="button button-secondary" for="file"><span data-icon="file" data-icon-class="icon-sm"></span> Load file</label>
            <input class="file-input" id="file" type="file" accept=".txt,.md,.csv,.html,text/plain">
            <button class="button button-ghost" id="replace" type="button">Replace queue</button>
          </div>
        </section>

        <ul class="shortcut-list" aria-label="Keyboard shortcuts">
          <li><kbd>Enter</kbd> open next</li>
          <li><kbd>S</kbd> skip next</li>
          <li><kbd>⌘</kbd><kbd>Z</kbd> undo</li>
          <li><kbd>⌘</kbd><kbd>Enter</kbd> add pasted</li>
        </ul>
      </div>
    </div>
  </main>
</body>
</html>
