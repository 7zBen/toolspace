<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Not found · toolspace</title>
  <style>
    :root { --bg: #f6f7f8; --text: #172334; --muted: #687588; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111925; --text: #f0f4fa; --muted: #a6b4c5; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    .mark { display: inline-grid; grid-template-columns: repeat(2, 12px); gap: 4px; padding: 12px; border-radius: 14px; background: #6379fc; transform: rotate(-7deg); margin-bottom: 22px; }
    .mark i { width: 12px; height: 12px; border-radius: 3px; background: #fff; }
    .mark i:nth-child(2) { opacity: .54; } .mark i:nth-child(3) { opacity: .67; }
    h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.03em; }
    p { margin: 0 0 22px; color: var(--muted); }
    a { display: inline-block; padding: 10px 16px; border-radius: 10px; background: #526bf0; color: #fff; font-weight: 650; text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>That page isn't here.</h1>
    <p>It may have moved when the site was rebuilt.</p>
    <a id="home" href="/">Back to toolspace</a>
  </div>
  <script>
    // GitHub Pages serves this for any missing path; send people to the project root, not the domain root.
    var seg = location.pathname.split("/").filter(Boolean)[0];
    if (location.hostname.endsWith("github.io") && seg) document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
